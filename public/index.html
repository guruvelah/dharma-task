<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secondhand Market</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #222; }
    header { background: #0f766e; color: #fff; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.2rem; margin: 0; }
    button { background: #0f766e; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button.secondary { background: #e5e7eb; color: #222; }
    main { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .toolbar input, .toolbar select { flex: 1 1 160px; padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; }
    .card, .detail { overflow-wrap: anywhere; min-width: 0; }
    .card { text-align: left; color: #222; font: inherit; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.15); }
    .price { color: #0f766e; font-weight: 700; font-size: 1.1rem; }
    .meta { color: #666; font-size: 0.85rem; margin-top: 4px; }
    .card p { margin: 8px 0 0; word-break: break-word; }
    form { background: #fff; padding: 16px; border-radius: 10px; display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
    form input, form select, form textarea { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; font-family: inherit; width: 100%; }
    .error { color: #b91c1c; font-size: 0.9rem; }
    .notice { background: #ecfdf5; color: #065f46; padding: 10px; border-radius: 6px; }
    .hidden { display: none !important; }
    .detail { background: #fff; padding: 20px; border-radius: 10px; max-width: 640px; margin: 0 auto; }
    .detail p { white-space: pre-wrap; word-break: break-word; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .empty { text-align: center; color: #666; padding: 40px 0; }
    @media (max-width: 480px) {
      header h1 { font-size: 1.05rem; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Secondhand Market</h1>
    <div>
      <button id="navBrowse">Browse</button>
      <button id="navSell" class="secondary">Sell an item</button>
    </div>
  </header>

  <main>
    <div id="pageError" class="error" role="alert"></div>
    <!-- Browse view -->
    <section id="browseView">
      <div class="toolbar">
        <input id="search" aria-label="Search items" type="search" placeholder="Search items...">
        <select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
      </div>
      <div id="grid" class="grid"></div>
      <div id="emptyMsg" class="empty hidden">No items found.</div>
    </section>

    <!-- Detail view -->
    <section id="detailView" class="hidden">
      <div id="detail" class="detail"></div>
    </section>

    <!-- Sell view -->
    <section id="sellView" class="hidden">
      <form id="sellForm">
        <h2 style="margin:0">List an item</h2>
        <input aria-label="Title" name="title" placeholder="Title (e.g. Used bicycle)" maxlength="80" required>
        <input aria-label="Price" name="price" type="number" min="0" step="0.01" placeholder="Price" required>
        <select aria-label="Category" name="category" id="categorySelect"></select>
        <textarea aria-label="Description" name="description" rows="4" placeholder="Describe condition, age, etc." maxlength="1000"></textarea>
        <input aria-label="Location" name="location" placeholder="Location (city / area)" maxlength="80">
        <input aria-label="Contact" name="contact" placeholder="Contact (phone or email)" maxlength="80" required>
        <div id="formError" class="error" role="alert"></div>
        <button type="submit">Post item</button>
        <div id="formNotice" class="notice hidden" role="status"></div>
      </form>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    const money = (n) => '$' + Number(n).toFixed(2);

    function showView(name) {
      ['browseView', 'detailView', 'sellView'].forEach((v) =>
        $(v).classList.toggle('hidden', v !== name)
      );
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Request failed.');
      return body;
    }
    function report(error) { $('pageError').textContent = error.message || 'Connection failed. Please try again.'; }
    let requestNumber = 0;
    async function loadCategories() {
      const cats = await api('/api/categories');
      const filter = $('categoryFilter');
      const select = $('categorySelect');
      cats.forEach((c) => {
        filter.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`);
        select.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`);
      });
    }

    async function loadItems() {
      const params = new URLSearchParams({
        q: $('search').value.trim(),
        category: $('categoryFilter').value,
      });
      const current = ++requestNumber;
      const items = await api('/api/items?' + params);
      if (current !== requestNumber) return;
      $('pageError').textContent = '';
      $('grid').innerHTML = items.map((i) => `
        <button type="button" class="card" data-id="${esc(i.id)}">
          <div class="price">${money(i.price)}</div>
          <strong>${esc(i.title)}</strong>
          <div class="meta">${esc(i.category)} · ${esc(i.location || 'No location')}</div>
          <p>${esc((i.description || '').slice(0, 100))}</p>
        </button>`).join('');
      $('emptyMsg').classList.toggle('hidden', items.length > 0);
    }

    async function showDetail(id) {
      const i = await api('/api/items/' + encodeURIComponent(id));
      $('detail').innerHTML = `
        <div class="price">${money(i.price)}</div>
        <h2 style="margin:6px 0">${esc(i.title)}</h2>
        <div class="meta">${esc(i.category)} · ${esc(i.location || 'No location')} · Posted ${new Date(i.createdAt).toLocaleDateString()}</div>
        <p>${esc(i.description || 'No description provided.')}</p>
        <p><strong>Contact:</strong> ${esc(i.contact)}</p>
        <div class="actions">
          <button class="secondary" id="backBtn">Back</button>
          <button id="soldBtn">Mark as sold</button>
        </div>`;
      $('backBtn').onclick = () => { showView('browseView'); loadItems().catch(report); };
      $('soldBtn').onclick = async () => {
        if (!confirm('Mark this item as sold? It will be hidden from listings.')) return;
        try { await api('/api/items/' + encodeURIComponent(id) + '/sold', { method: 'POST' }); }
        catch (error) { report(error); return; }
        showView('browseView');
        loadItems().catch(report);
      };
      showView('detailView');
    }

    $('grid').addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (card) showDetail(card.dataset.id).catch(report);
    });

    $('search').addEventListener('input', () => loadItems().catch(report));
    $('categoryFilter').addEventListener('change', () => loadItems().catch(report));
    $('navBrowse').onclick = () => { showView('browseView'); loadItems().catch(report); };
    $('navSell').onclick = () => { showView('sellView'); $('formNotice').classList.add('hidden'); };

    $('sellForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('formError').textContent = '';
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());
      data.price = Number(data.price);
      const submit = form.querySelector('[type="submit"]');
      submit.disabled = true;
      $('formNotice').classList.add('hidden');
      try {
        await api('/api/items', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
      } catch (error) {
        $('formError').textContent = error.message || 'Connection failed. Please try again.';
        return;
      } finally { submit.disabled = false; }

      form.reset();
      $('formNotice').textContent = 'Your item is live!';
      $('formNotice').classList.remove('hidden');
    });

    loadCategories().then(loadItems).catch(report);
  </script>
</body>
</html>
